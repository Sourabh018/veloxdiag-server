spring:
  application:
    name: veloxdiag-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_KEY_1:},${GEMINI_KEY_2:},${GEMINI_KEY_3:}

admin:
  # Shared-secret token required to hit /api/admin/reset-application. Set this
  # in Render's environment variables (NOT committed here, NOT a real secret
  # value in this file) — leave unset locally to keep reset disabled by default.
  reset-token: ${ADMIN_RESET_TOKEN:}