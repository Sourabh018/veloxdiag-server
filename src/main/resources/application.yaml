spring:
  application:
    name: veloxdiag-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

groq:
  api:
    key: ${GROQ_KEY_1:},${GROQ_KEY_2:},${GROQ_KEY_3:}

admin:
  reset-token: ${ADMIN_RESET_TOKEN:}

telemetry:
  ingest-token: ${TELEMETRY_INGEST_TOKEN:}

# Self-monitoring — veloxdiag-server watching its own queries/performance
# via veloxdiag-starter, same as any other connected app.
veloxdiag:
  applicationName: veloxdiag-server
  serverUrl: ${VELOXDIAG_SELF_URL:https://veloxdiag-server.onrender.com}
  apiKey: ${VELOXDIAG_SELF_API_KEY:Mwj3TRoAjy1weH_9IhtlRi4PdvGaMqJ4}
  excluded-paths:
    # Ingest endpoint itself — without this, every telemetry POST is a
    # request that gets telemetry-tracked, which sends another telemetry
    # POST, which gets tracked, forever (the 429/TaskRejectedException loop).
    - /api/telemetry
    - /api/slow-query-plans
    # Dashboard/auth traffic isn't meaningful "app performance" data anyway.
    - /api/dashboard/**
    - /api/auth/**
    - /api/applications/**
    - /actuator/**