spring:
  application:
    name: veloxdiag-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

gemini:
  api:
    key: ${GEMINI_KEY_1:},${GEMINI_KEY_2:},${GEMINI_KEY_3:}

admin:
  reset-token: ${ADMIN_RESET_TOKEN:}
  
telemetry:
  ingest-token: ${TELEMETRY_INGEST_TOKEN:}